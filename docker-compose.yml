version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NODE_ENV=production
      - SHOP_NAME=Mama Njeri Duka
      - TILL_NUMBER=5012345
      - AT_USERNAME=sandbox
      - AT_API_KEY=atsk_sandbox_dummy_key_replace_with_live
    volumes:
      - server-data:/app/data
    restart: always

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

volumes:
  server-data:
