name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Server Dependencies
      run: |
        cd server
        npm install

    - name: Run Server Automated Tests
      run: |
        cd server
        npm test

    - name: Build Server
      run: |
        cd server
        npm run build

    - name: Install Client Dependencies
      run: |
        cd client
        npm install

    - name: Build Client (Vite + TypeScript)
      run: |
        cd client
        npm run build
